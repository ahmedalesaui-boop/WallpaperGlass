name: Build WallpaperGlass IPA
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Create project files
        run: |
          mkdir -p WallpaperGlass
          cat > WallpaperGlass/App.swift <<'WG_EOF'
          import SwiftUI

          @main
          struct WallpaperGlassApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .preferredColorScheme(.dark)
                  }
              }
          }
          WG_EOF
          mkdir -p WallpaperGlass
          cat > WallpaperGlass/ContentView.swift <<'WG_EOF'
          import SwiftUI
          import Photos
          import UIKit

          struct Wallpaper: Identifiable, Hashable {
              let id: Int
              let title: String
              let category: String
              let imageURL: String
              var url: URL { URL(string: imageURL)! }
          }

          private let wallpapers: [Wallpaper] = [
              .init(id: 1, title: "نيون أزرق", category: "مجردة", imageURL: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=900&q=90"),
              .init(id: 2, title: "غروب البحر", category: "طبيعة", imageURL: "https://images.unsplash.com/photo-1500375592092-40eb2168fd21?w=900&q=90"),
              .init(id: 3, title: "مدينة الليل", category: "مدن", imageURL: "https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=900&q=90"),
              .init(id: 4, title: "أوراق خضراء", category: "طبيعة", imageURL: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=900&q=90"),
              .init(id: 5, title: "سماء ونجوم", category: "فضاء", imageURL: "https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=900&q=90"),
              .init(id: 6, title: "سيارة رياضية", category: "سيارات", imageURL: "https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=900&q=90")
          ]

          struct ContentView: View {
              @State private var selectedCategory = "الكل"
              @State private var searchText = ""
              @State private var favorites: Set<Int> = []
              @State private var selectedWallpaper: Wallpaper?
              @State private var tab = 0
              private let categories = ["الكل", "سيارات", "طبيعة", "مجردة", "مدن", "فضاء"]

              private var filtered: [Wallpaper] {
                  wallpapers.filter {
                      (selectedCategory == "الكل" || $0.category == selectedCategory) &&
                      (searchText.isEmpty || $0.title.localizedCaseInsensitiveContains(searchText))
                  }.filter { tab != 1 || favorites.contains($0.id) }
              }

              var body: some View {
                  ZStack {
                      LinearGradient(colors: [Color(red: 0.015, green: 0.025, blue: 0.09), Color(red: 0.025, green: 0.12, blue: 0.28), .black], startPoint: .topLeading, endPoint: .bottomTrailing)
                          .ignoresSafeArea()
                      Circle().fill(.blue.opacity(0.25)).frame(width: 260).blur(radius: 90).offset(x: 150, y: -330)
                      VStack(spacing: 16) {
                          header
                          if tab == 2 {
                              downloadsView
                          } else {
                              ScrollView(showsIndicators: false) {
                                  VStack(alignment: .leading, spacing: 18) {
                                      hero
                                      categoryStrip
                                      HStack {
                                          Text(tab == 1 ? "المفضلة" : "أحدث الخلفيات")
                                              .font(.system(size: 22, weight: .bold))
                                          Spacer()
                                          Text("\(filtered.count) خلفية").font(.caption).foregroundStyle(.white.opacity(0.55))
                                      }
                                      LazyVGrid(columns: [GridItem(.flexible()), GridItem(.flexible())], spacing: 14) {
                                          ForEach(filtered) { item in
                                              WallpaperCard(wallpaper: item, isFavorite: favorites.contains(item.id), favoriteAction: {
                                                  if favorites.contains(item.id) { favorites.remove(item.id) } else { favorites.insert(item.id) }
                                              }, openAction: { selectedWallpaper = item })
                                          }
                                      }
                                  }.padding(.horizontal, 18).padding(.bottom, 18)
                              }
                          }
                          bottomBar
                      }
                      .padding(.top, 8)
                  }
                  .sheet(item: $selectedWallpaper) { wallpaper in
                      WallpaperDetail(wallpaper: wallpaper, isFavorite: favorites.contains(wallpaper.id), favoriteAction: {
                          if favorites.contains(wallpaper.id) { favorites.remove(wallpaper.id) } else { favorites.insert(wallpaper.id) }
                      })
                      .presentationDetents([.large])
                      .presentationDragIndicator(.visible)
                  }
              }

              private var header: some View {
                  HStack {
                      Image(systemName: "gearshape.fill").font(.title3).padding(12).background(.ultraThinMaterial, in: Circle())
                      Spacer()
                      VStack(spacing: 2) {
                          Text("خلفيات الآيفون").font(.system(size: 25, weight: .heavy))
                          Text("جمال أكثر .. لشاشتك أجمل").font(.caption).foregroundStyle(.white.opacity(0.65))
                      }
                      Spacer()
                      Image(systemName: "heart.fill").font(.title3).foregroundStyle(.pink).padding(12).background(.ultraThinMaterial, in: Circle())
                  }.padding(.horizontal, 18)
              }

              private var hero: some View {
                  ZStack(alignment: .leading) {
                      RoundedRectangle(cornerRadius: 28).fill(LinearGradient(colors: [.blue.opacity(0.65), .purple.opacity(0.55), .black], startPoint: .topTrailing, endPoint: .bottomLeading))
                      VStack(alignment: .leading, spacing: 10) {
                          Text("خلفيات عالية الجودة").font(.system(size: 23, weight: .bold))
                          Text("بدقة 4K").font(.system(size: 36, weight: .black)).foregroundStyle(.cyan)
                          Text("جدّد شاشة الآيفون كل يوم").font(.subheadline).foregroundStyle(.white.opacity(0.8))
                          Label("استكشف الآن", systemImage: "arrow.left").font(.subheadline.bold()).padding(.horizontal, 16).padding(.vertical, 10).background(.white.opacity(0.18), in: Capsule())
                      }.padding(22)
                      Image(systemName: "iphone.gen3").font(.system(size: 125, weight: .ultraLight)).foregroundStyle(.white.opacity(0.2)).rotationEffect(.degrees(-12)).offset(x: 205, y: 8)
                  }.frame(height: 185).clipShape(RoundedRectangle(cornerRadius: 28)).overlay(RoundedRectangle(cornerRadius: 28).stroke(.white.opacity(0.2), lineWidth: 1))
              }

              private var categoryStrip: some View {
                  ScrollView(.horizontal, showsIndicators: false) {
                      HStack(spacing: 9) {
                          ForEach(categories, id: \.self) { category in
                              Button { selectedCategory = category } label: {
                                  Text(category).font(.subheadline.weight(.semibold)).padding(.horizontal, 16).padding(.vertical, 10)
                                      .background(selectedCategory == category ? AnyShapeStyle(LinearGradient(colors: [.cyan, .blue, .purple], startPoint: .leading, endPoint: .trailing)) : AnyShapeStyle(.ultraThinMaterial), in: Capsule())
                                      .overlay(Capsule().stroke(.white.opacity(0.16), lineWidth: 1))
                              }.buttonStyle(.plain)
                          }
                      }
                  }
              }

              private var downloadsView: some View {
                  VStack(spacing: 12) {
                      Image(systemName: "arrow.down.to.line").font(.system(size: 42)).foregroundStyle(.cyan)
                      Text("تحميلاتك").font(.title2.bold())
                      Text("الخلفيات التي تحفظها ستظهر هنا في النسخة القادمة").font(.subheadline).foregroundStyle(.white.opacity(0.6)).multilineTextAlignment(.center)
                  }.frame(maxWidth: .infinity, maxHeight: .infinity)
              }

              private var bottomBar: some View {
                  HStack {
                      tabButton("magnifyingglass", "بحث", 3)
                      tabButton("heart", "المفضلة", 1)
                      tabButton("house.fill", "الرئيسية", 0)
                      tabButton("arrow.down", "تحميلاتي", 2)
                  }.padding(.vertical, 12).background(.ultraThinMaterial, in: Capsule()).overlay(Capsule().stroke(.white.opacity(0.18), lineWidth: 1)).padding(.horizontal, 14).padding(.bottom, 4)
              }

              private func tabButton(_ icon: String, _ title: String, _ value: Int) -> some View {
                  Button { tab = value } label: {
                      VStack(spacing: 5) {
                          Image(systemName: icon).font(.system(size: 19, weight: .semibold))
                          Text(title).font(.system(size: 10, weight: .semibold))
                      }.foregroundStyle(tab == value ? Color.cyan : Color.white.opacity(0.75)).frame(maxWidth: .infinity)
                  }.buttonStyle(.plain)
              }
          }

          struct WallpaperCard: View {
              let wallpaper: Wallpaper
              let isFavorite: Bool
              let favoriteAction: () -> Void
              let openAction: () -> Void

              var body: some View {
                  Button(action: openAction) {
                      ZStack(alignment: .topTrailing) {
                          AsyncImage(url: wallpaper.url) { phase in
                              if let image = phase.image { image.resizable().scaledToFill() }
                              else { RoundedRectangle(cornerRadius: 22).fill(.white.opacity(0.08)).overlay(ProgressView().tint(.cyan)) }
                          }.frame(height: 225).frame(maxWidth: .infinity).clipped()
                          Button(action: favoriteAction) {
                              Image(systemName: isFavorite ? "heart.fill" : "heart").foregroundStyle(isFavorite ? Color.pink : Color.white).padding(9).background(.black.opacity(0.35), in: Circle())
                          }.buttonStyle(.plain).padding(10)
                          VStack { Spacer(); HStack { Text(wallpaper.title).font(.caption.bold()); Spacer(); Image(systemName: "arrow.down.circle").font(.title3) } .padding(11).background(.black.opacity(0.38)) }
                      }
                      .clipShape(RoundedRectangle(cornerRadius: 22))
                      .overlay(RoundedRectangle(cornerRadius: 22).stroke(.white.opacity(0.22), lineWidth: 1))
                  }.buttonStyle(.plain)
              }
          }

          struct WallpaperDetail: View {
              let wallpaper: Wallpaper
              let isFavorite: Bool
              let favoriteAction: () -> Void
              @Environment(\.dismiss) private var dismiss
              @State private var message = ""

              var body: some View {
                  ZStack {
                      Color.black.ignoresSafeArea()
                      VStack(spacing: 14) {
                          AsyncImage(url: wallpaper.url) { phase in
                              if let image = phase.image { image.resizable().scaledToFit() }
                              else { ProgressView().tint(.cyan) }
                          }.frame(maxHeight: .infinity)
                          Text(wallpaper.title).font(.title2.bold())
                          HStack(spacing: 14) {
                              Button(action: favoriteAction) { Label("المفضلة", systemImage: isFavorite ? "heart.fill" : "heart").frame(maxWidth: .infinity).padding().background(.ultraThinMaterial, in: Capsule()) }
                              Button { saveImage() } label: { Label("حفظ الصورة", systemImage: "arrow.down.to.line").frame(maxWidth: .infinity).padding().background(LinearGradient(colors: [.cyan, .blue, .purple], startPoint: .leading, endPoint: .trailing), in: Capsule()) }
                          }.buttonStyle(.plain).padding(.horizontal)
                          if !message.isEmpty { Text(message).font(.footnote).foregroundStyle(.white.opacity(0.75)) }
                      }.padding()
                  }
              }

              private func saveImage() {
                  Task {
                      do {
                          let (data, _) = try await URLSession.shared.data(from: wallpaper.url)
                          guard let image = UIImage(data: data) else { message = "تعذّر تحميل الصورة"; return }
                          let status = PHPhotoLibrary.authorizationStatus(for: .addOnly)
                          if status == .authorized || status == .limited {
                              UIImageWriteToSavedPhotosAlbum(image, nil, nil, nil)
                              message = "تم إرسال الصورة إلى تطبيق الصور"
                          } else {
                              let result = await PHPhotoLibrary.requestAuthorization(for: .addOnly)
                              if result == .authorized || result == .limited {
                                  UIImageWriteToSavedPhotosAlbum(image, nil, nil, nil)
                                  message = "تم إرسال الصورة إلى تطبيق الصور"
                              } else { message = "يرجى السماح للتطبيق بإضافة الصور من الإعدادات" }
                          }
                      } catch { message = "فشل التحميل، تحقق من الإنترنت" }
                  }
              }
          }
          WG_EOF
          mkdir -p WallpaperGlass
          cat > WallpaperGlass/Info.plist <<'WG_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleDisplayName</key><string>خلفيات الآيفون</string>
          <key>NSPhotoLibraryAddUsageDescription</key><string>نحتاج الإذن لحفظ الخلفيات في تطبيق الصور.</string>
          <key>UILaunchScreen</key><dict/>
          <key>UIApplicationSceneManifest</key><dict><key>UIApplicationSupportsMultipleScenes</key><false/></dict>
          <key>UIUserInterfaceStyle</key><string>Dark</string>
          </dict></plist>
          WG_EOF
          mkdir -p WallpaperGlass.xcodeproj
          cat > WallpaperGlass.xcodeproj/project.pbxproj <<'WG_EOF'
          // !$*UTF8*$!
          {
           archiveVersion = 1;
           classes = {};
           objectVersion = 56;
           objects = {
            A10000000000000000000001 = {isa = PBXProject; attributes = {BuildIndependentTargetsInParallel = 1; LastUpgradeCheck = 1600;}; buildConfigurationList = A10000000000000000000008; compatibilityVersion = "Xcode 14.0"; developmentRegion = en; hasScannedForEncodings = 0; knownRegions = (en, Base,); mainGroup = A10000000000000000000002; productRefGroup = A10000000000000000000004; projectDirPath = ""; projectRoot = ""; targets = (A10000000000000000000006,);};
            A10000000000000000000002 = {isa = PBXGroup; children = (A10000000000000000000003, A10000000000000000000004, A10000000000000000000005,); sourceTree = "<group>";};
            A10000000000000000000003 = {isa = PBXGroup; children = (A10000000000000000000009, A1000000000000000000000A,); path = WallpaperGlass; sourceTree = "<group>";};
            A10000000000000000000004 = {isa = PBXGroup; children = (A1000000000000000000000B,); name = Products; sourceTree = "<group>";};
            A10000000000000000000005 = {isa = PBXGroup; children = (); name = Frameworks; sourceTree = "<group>";};
            A10000000000000000000006 = {isa = PBXNativeTarget; buildConfigurationList = A1000000000000000000000C; buildPhases = (A1000000000000000000000D, A1000000000000000000000E,); buildRules = (); dependencies = (); name = WallpaperGlass; productName = WallpaperGlass; productReference = A1000000000000000000000B; productType = "com.apple.product-type.application";};
            A10000000000000000000014 = {isa = PBXBuildFile; fileRef = A10000000000000000000009;};
            A10000000000000000000015 = {isa = PBXBuildFile; fileRef = A1000000000000000000000A;};
            A10000000000000000000009 = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = App.swift; sourceTree = "<group>";};
            A1000000000000000000000A = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = ContentView.swift; sourceTree = "<group>";};
            A1000000000000000000000B = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = WallpaperGlass.app; sourceTree = BUILT_PRODUCTS_DIR;};
            A1000000000000000000000D = {isa = PBXSourcesBuildPhase; buildActionMask = 2147483647; files = (A10000000000000000000014, A10000000000000000000015,); runOnlyForDeploymentPostprocessing = 0;};
            A1000000000000000000000E = {isa = PBXResourcesBuildPhase; buildActionMask = 2147483647; files = (); runOnlyForDeploymentPostprocessing = 0;};
            A10000000000000000000008 = {isa = XCConfigurationList; buildConfigurations = (A10000000000000000000010, A10000000000000000000011,); defaultConfigurationIsVisible = 0;};
            A1000000000000000000000C = {isa = XCConfigurationList; buildConfigurations = (A10000000000000000000012, A10000000000000000000013,); defaultConfigurationIsVisible = 0;};
            A10000000000000000000010 = {isa = XCBuildConfiguration; buildSettings = {IPHONEOS_DEPLOYMENT_TARGET = 16.0; SDKROOT = iphoneos; SWIFT_VERSION = 5.0;}; name = Debug;};
            A10000000000000000000011 = {isa = XCBuildConfiguration; buildSettings = {IPHONEOS_DEPLOYMENT_TARGET = 16.0; SDKROOT = iphoneos; SWIFT_VERSION = 5.0;}; name = Release;};
            A10000000000000000000012 = {isa = XCBuildConfiguration; buildSettings = {PRODUCT_BUNDLE_IDENTIFIER = com.ahmed.wallpaperglass; PRODUCT_NAME = "$(TARGET_NAME)"; INFOPLIST_FILE = WallpaperGlass/Info.plist; GENERATE_INFOPLIST_FILE = YES; TARGETED_DEVICE_FAMILY = "1"; IPHONEOS_DEPLOYMENT_TARGET = 16.0; SWIFT_VERSION = 5.0; CODE_SIGN_STYLE = Manual; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO; MARKETING_VERSION = 1.0; CURRENT_PROJECT_VERSION = 1;}; name = Debug;};
            A10000000000000000000013 = {isa = XCBuildConfiguration; buildSettings = {PRODUCT_BUNDLE_IDENTIFIER = com.ahmed.wallpaperglass; PRODUCT_NAME = "$(TARGET_NAME)"; INFOPLIST_FILE = WallpaperGlass/Info.plist; GENERATE_INFOPLIST_FILE = YES; TARGETED_DEVICE_FAMILY = "1"; IPHONEOS_DEPLOYMENT_TARGET = 16.0; SWIFT_VERSION = 5.0; CODE_SIGN_STYLE = Manual; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO; MARKETING_VERSION = 1.0; CURRENT_PROJECT_VERSION = 1;}; name = Release;};
           };
           rootObject = A10000000000000000000001;
          }
          WG_EOF
          mkdir -p WallpaperGlass.xcodeproj/xcshareddata/xcschemes
          cat > WallpaperGlass.xcodeproj/xcshareddata/xcschemes/WallpaperGlass.xcscheme <<'WG_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme LastUpgradeVersion="1600" version="1.7">
             <BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES">
                <BuildActionEntries>
                   <BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="YES" buildForArchiving="YES" buildForAnalyzing="YES">
                      <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="A10000000000000000000006" BuildableName="WallpaperGlass.app" BlueprintName="WallpaperGlass" ReferencedContainer="container:WallpaperGlass.xcodeproj">
                      </BuildableReference>
                   </BuildActionEntry>
                </BuildActionEntries>
             </BuildAction>
             <LaunchAction buildConfiguration="Debug" selectedDebuggerIdentifier="Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier="Xcode.DebuggerFoundation.Launcher.LLDB" launchStyle="0" useCustomWorkingDirectory="NO" ignoresPersistentStateOnLaunch="NO" debugDocumentVersioning="YES" debugServiceExtension="internal" allowLocationSimulation="YES">
                <BuildableProductRunnable runnableDebuggingMode="0">
                   <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="A10000000000000000000006" BuildableName="WallpaperGlass.app" BlueprintName="WallpaperGlass" ReferencedContainer="container:WallpaperGlass.xcodeproj">
                   </BuildableReference>
                </BuildableProductRunnable>
             </LaunchAction>
             <ArchiveAction buildConfiguration="Release" revealArchiveInOrganizer="YES">
             </ArchiveAction>
          </Scheme>
          WG_EOF
      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project WallpaperGlass.xcodeproj -scheme WallpaperGlass -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WallpaperGlass.app Payload/
          zip -qry WallpaperGlass-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: WallpaperGlass-unsigned-IPA
          path: WallpaperGlass-unsigned.ipa
